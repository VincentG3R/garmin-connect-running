[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-connect-running"
version = "1.0.0"
description = "Crée des entraînements course à pied dans Garmin Connect via l'API interne (connectapi.garmin.com)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "VincentG3R" }]
keywords = ["garmin", "garmin-connect", "running", "workout", "fitness"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
]
dependencies = [
    "garminconnect>=0.2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
garmin-running = "garmin_workouts:main"

[project.urls]
Homepage = "https://github.com/VincentG3R/garmin-connect-running"
Issues = "https://github.com/VincentG3R/garmin-connect-running/issues"

[tool.setuptools]
py-modules = ["garmin_workouts"]

[tool.pytest.ini_options]
pythonpath = ["."]
